name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'jaeger-os @ git+https://github.com/JenkinsRobotics/JaegerOS@master'
          pip install '.[dev]'

      - name: Lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${BASE_SHA}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
          fi
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git diff --name-only -z --diff-filter=ACMRT "$base" HEAD -- '*.py')
          if (( ${#files[@]} )); then
            ruff check "${files[@]}"
          else
            echo "No changed Python files to lint."
          fi

      - name: Installed-package tests
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q --import-mode=importlib --timeout=90
